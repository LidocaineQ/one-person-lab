name: Daily OPL Package Channel

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      release_set_generation:
        description: Optional Release Set generation override. Empty allocates the next UTC YY.M.D[-rN].
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: opl-daily-package-channel-${{ github.repository_owner }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  detect-package-channel-change:
    name: Detect package-channel source changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout OPL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Resolve Release Set generation
        id: generation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.release_set_generation || '' }}"
          if [ -n "$requested" ]; then
            generation="${requested#v}"
          else
            base="$(date -u +'%y.%-m.%-d')"
            tags_file="$RUNNER_TEMP/opl-release-set-tags.txt"
            echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
            oras repo tags "ghcr.io/${{ github.repository_owner }}/one-person-lab-manifest" > "$tags_file"
            generation="$(node scripts/release-set-generation.mjs --base "$base" --existing-tags-file "$tags_file")"
          fi
          if ! [[ "$generation" =~ ^[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,2}(-r[1-9][0-9]*)?$ ]]; then
            echo "::error::Invalid daily Release Set generation: $generation"
            exit 1
          fi
          echo "release_set_generation=$generation" >> "$GITHUB_OUTPUT"
          echo "owner_cohort_artifact_name=opl-daily-package-channel-candidate-$generation" >> "$GITHUB_OUTPUT"
          echo "OPL_RELEASE_SET_GENERATION=$generation" >> "$GITHUB_ENV"
          echo "OPL_PACKAGES_OWNER=${{ github.repository_owner }}" >> "$GITHUB_ENV"

      - name: Fetch current latest-stable Release Set manifest
        id: current
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/opl-current-channel
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          carrier="ghcr.io/${OPL_PACKAGES_OWNER}/one-person-lab-manifest"
          descriptor="$RUNNER_TEMP/opl-latest-stable-descriptor.json"
          descriptor_error="$RUNNER_TEMP/opl-latest-stable-descriptor.error"
          if ! oras manifest fetch --descriptor "${carrier}:latest-stable" \
            > "$descriptor" 2> "$descriptor_error"; then
            tags="$RUNNER_TEMP/opl-release-set-tags-at-freeze.txt"
            if ! oras repo tags "$carrier" > "$tags"; then
              echo "::error::Unable to verify whether latest-stable exists; bootstrap is forbidden on an availability error."
              exit 1
            fi
            if grep -Fxq latest-stable "$tags"; then
              echo "::error::latest-stable exists but its exact digest could not be resolved."
              exit 1
            fi
            echo "::notice::No latest-stable Release Set exists; bootstrapping all nine Packages to candidate."
            {
              echo "current_manifest="
              echo "frozen_base_release_set_generation=none"
              echo "frozen_base_release_set_digest=none"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          frozen_digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$descriptor")"
          oras pull "${carrier}@${frozen_digest}" --output dist/opl-current-channel
          mapfile -t release_manifests < <(find dist/opl-current-channel -type f -name opl-release-manifest.json -print)
          mapfile -t channel_manifests < <(find dist/opl-current-channel -type f -name opl-channel-manifest.json -print)
          [ "${#release_manifests[@]}" -eq 1 ] && [ "${#channel_manifests[@]}" -eq 1 ] || {
            echo "::error::Frozen latest-stable carrier must contain exactly one release manifest and one channel manifest."
            exit 1
          }
          release_manifest="${release_manifests[0]}"
          current="${channel_manifests[0]}"
          frozen_generation="$(jq -er '.release_set.generation | select(test("^[0-9]{2}\\.[0-9]{1,2}\\.[0-9]{1,2}(-r[1-9][0-9]*)?$"))' "$release_manifest")"
          jq -e \
            --arg generation "$frozen_generation" \
            '.release_set.surface_kind == "opl_release_set.v2"
              and .release_set.bom_status == "complete"
              and .release_set_generation == $generation
              and .release_set.generation == $generation' \
            "$release_manifest" >/dev/null
          jq -e --arg generation "$frozen_generation" \
            '.release_set_generation == $generation' "$current" >/dev/null
          if [ "$current" != "dist/opl-current-channel/opl-channel-manifest.json" ]; then
            cp "$current" dist/opl-current-channel/opl-channel-manifest.json
          fi
          {
            echo "current_manifest=dist/opl-current-channel/opl-channel-manifest.json"
            echo "frozen_base_release_set_generation=$frozen_generation"
            echo "frozen_base_release_set_digest=$frozen_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Build Package projection fingerprint
        id: projection
        shell: bash
        env:
          OPL_PACKAGE_RELEASE_GATE: daily_package_channel_detection
        run: |
          set -euo pipefail
          mkdir -p dist/opl-daily-packages
          args=(
            --projection-root .
            --release-set-generation "$OPL_RELEASE_SET_GENERATION"
            --summary-path dist/opl-daily-packages/daily-package-channel-summary.json
          )
          if [ -n "${{ steps.current.outputs.current_manifest }}" ]; then
            args+=(--current-manifest "${{ steps.current.outputs.current_manifest }}")
          fi
          npm run packages:daily-check -- "${args[@]}"

      - name: Compare independent Package fingerprints
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          summary=dist/opl-daily-packages/daily-package-channel-summary.json
          test -f "$summary"
          owner_state=dist/opl-daily-packages/current-owner-channels.json
          plan=dist/opl-daily-packages/owner-channel-publication-plan.json
          jq -n '{surface_kind:"opl_package_owner_channel_state.v1",packages:{}}' > "$owner_state"
          while IFS= read -r package_id; do
            image="ghcr.io/${{ github.repository_owner }}/one-person-lab-packages/$package_id"
            descriptor_file="$RUNNER_TEMP/opl-$package_id-latest-stable-descriptor.json"
            descriptor_error="$RUNNER_TEMP/opl-$package_id-latest-stable-descriptor.error"
            manifest_file="$RUNNER_TEMP/opl-$package_id-latest-stable-manifest.json"
            payload_file="$RUNNER_TEMP/opl-$package_id-latest-stable-payload.json"
            if oras manifest fetch --descriptor "$image:latest-stable" \
              > "$descriptor_file" 2> "$descriptor_error"; then
              digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$descriptor_file")"
              oras manifest fetch "${image}@${digest}" > "$manifest_file"
              payload_digest="$(jq -er \
                '[.layers[] | select(.mediaType == "application/vnd.onepersonlab.package.payload.v1+json") | .digest] | select(length == 1) | .[0]' \
                "$manifest_file")"
              for attempt in 1 2 3; do
                if oras blob fetch --output "$payload_file" "${image}@${payload_digest}"; then
                  break
                fi
                [ "$attempt" -lt 3 ] || exit 1
                sleep "$((attempt * 5))"
              done
              jq -e \
                --arg id "$package_id" \
                '.package_id == $id
                  and (.package_version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
                  and (.source_commit | test("^[0-9a-f]{40}$"))
                  and (.content_lock.digest | test("^sha256:[0-9a-f]{64}$"))' \
                "$payload_file" >/dev/null
              entry="$(jq -c \
                --arg digest "$digest" \
                '{status:"present",digest:$digest,fingerprint:{package_version:.package_version,package_content_digest:.content_lock.digest,owner_source_commit:.source_commit}}' \
                "$payload_file")"
            else
              tags_file="$RUNNER_TEMP/opl-$package_id-tags.txt"
              tags_error="$RUNNER_TEMP/opl-$package_id-tags.error"
              if oras repo tags "$image" > "$tags_file" 2> "$tags_error"; then
                if grep -Fxq latest-stable "$tags_file"; then
                  echo "::error::latest-stable exists but its exact digest could not be resolved for $package_id."
                  exit 1
                fi
                entry='{"status":"absent","digest":null,"fingerprint":null}'
              elif grep -Fq 'name unknown: repository name not known to registry' "$tags_error"; then
                echo "::notice::No owner repository exists for $package_id; treating the independent channel as verified absence."
                entry='{"status":"absent","digest":null,"fingerprint":null}'
              else
                echo "::error::Unable to read the independent latest-stable state for $package_id."
                cat "$descriptor_error" >&2
                cat "$tags_error" >&2
                exit 1
              fi
            fi
            jq --arg id "$package_id" --argjson entry "$entry" \
              '.packages[$id] = $entry' "$owner_state" > "$owner_state.next"
            mv "$owner_state.next" "$owner_state"
          done < <(jq -er '.candidate_fingerprint | keys[]' "$summary")

          set +e
          node scripts/package-owner-channel-plan.mjs \
            --candidate-summary "$summary" \
            --current-state "$owner_state" \
            --output "$plan"
          plan_status=$?
          set -e
          if [ "$plan_status" -eq 2 ]; then
            jq -r '.violations[] | "::error::\(.package_id): \(.reason) current=\(.current_version) candidate=\(.candidate_version)"' "$plan"
            exit 1
          fi
          [ "$plan_status" -eq 0 ]
          summary_status="$(jq -r .status "$plan")"
          publish_required="$(jq -r .publish_required "$plan")"
          echo "publish_required=$publish_required" >> "$GITHUB_OUTPUT"
          changed_packages_json="$(jq -c .changed_packages "$plan")"
          echo "changed_packages_json=$changed_packages_json" >> "$GITHUB_OUTPUT"
          non_package_changed_components_json="$(jq -c '.non_package_changed_components // []' "$summary")"
          echo "non_package_changed_components_json=$non_package_changed_components_json" >> "$GITHUB_OUTPUT"
          publication_scope="$(jq -r '.publication_scope // "packages_only"' "$summary")"
          [ "$publication_scope" = packages_only ] || {
            echo "::error::Package publication scope drifted: $publication_scope"
            exit 1
          }
          echo "publication_scope=$publication_scope" >> "$GITHUB_OUTPUT"
          dispatch_plan=dist/opl-daily-packages/package-publication-dispatch-plan.json
          entries='[]'
          ready_entries='[]'
          needs_owner_release='[]'
          if [ "$publish_required" = true ]; then
            while IFS= read -r package_id; do
              version="$(jq -er --arg id "$package_id" '.candidate_fingerprint[$id].package_version' "$summary")"
              owner_commit="$(jq -er --arg id "$package_id" '.candidate_fingerprint[$id].owner_source_commit' "$summary")"
              predecessor="$(jq -er --arg id "$package_id" '.packages[$id] | if .status == "present" then .digest else "none" end' "$owner_state")"
              request_id="daily-${{ github.run_id }}-${{ github.run_attempt }}-${package_id}"
              manifest="contracts/opl-framework/packages/${package_id}.json"
              source_repo="$(jq -er .source_repo "$manifest")"
              if [[ "$source_repo" =~ ^https://github\.com/([^/]+)/([^/]+)\.git$ ]]; then
                owner_repo="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
              else
                echo "::error::${package_id}: Package source_repo is not a canonical GitHub repository: ${source_repo}"
                exit 1
              fi
              owner_tag="v${version}"
              tag_error="$RUNNER_TEMP/opl-${package_id}-owner-tag.error"
              set +e
              tagged_commit="$(gh api "repos/${owner_repo}/commits/${owner_tag}" --jq .sha 2>"$tag_error")"
              tag_status=$?
              set -e
              if [ "$tag_status" -eq 0 ] && [[ "$tagged_commit" =~ ^[0-9a-f]{40}$ ]]; then
                if [ "$tagged_commit" != "$owner_commit" ]; then
                  echo "::error::${package_id}: owner tag ${owner_tag} resolves to ${tagged_commit}, expected ${owner_commit}."
                  exit 1
                fi
                tag_state=ready
              elif [ "$tag_status" -ne 0 ] && grep -Eq 'HTTP 404|Not Found|not found' "$tag_error"; then
                echo "::notice::${package_id}: ${owner_repo} has no ${owner_tag}; status=needs_owner_release."
                tag_state=needs_owner_release
              else
                echo "::error::${package_id}: unable to resolve owner tag ${owner_repo}@${owner_tag}."
                cat "$tag_error" >&2
                exit 1
              fi
              entry="$(jq -n \
                --arg package_id "$package_id" \
                --arg version "$version" \
                --arg owner_commit "$owner_commit" \
                --arg predecessor "$predecessor" \
                --arg request_id "$request_id" \
                --arg owner_repo "$owner_repo" \
                --arg owner_tag "$owner_tag" \
                --arg tag_state "$tag_state" \
                '{package_id:$package_id,expected_package_version:$version,
                  expected_owner_source_commit:$owner_commit,
                  expected_latest_stable_predecessor:$predecessor,
                  publication_request_id:$request_id,owner_repository:$owner_repo,
                  owner_tag:$owner_tag,owner_tag_status:$tag_state}')"
              entries="$(jq -c --argjson entry "$entry" '. + [$entry]' <<<"$entries")"
              if [ "$tag_state" = ready ]; then
                ready_entries="$(jq -c --argjson entry "$entry" '. + [$entry]' <<<"$ready_entries")"
              else
                needs_owner_release="$(jq -c --argjson entry "$entry" '. + [$entry]' <<<"$needs_owner_release")"
              fi
            done < <(jq -er '.changed_packages[]' "$plan")
          fi
          ready_count="$(jq 'length' <<<"$ready_entries")"
          needs_count="$(jq 'length' <<<"$needs_owner_release")"
          if [ "$publish_required" != true ]; then
            dispatch_status=skipped
          elif [ "$ready_count" -gt 0 ]; then
            dispatch_status=publish_ready
          else
            dispatch_status=needs_owner_release
          fi
          jq -n \
            --arg surface_kind opl_package_publication_dispatch_plan.v1 \
            --arg source_run_id "${{ github.run_id }}" \
            --arg source_run_attempt "${{ github.run_attempt }}" \
            --arg framework_source_commit "${{ github.sha }}" \
            --arg release_set_generation "${{ steps.generation.outputs.release_set_generation }}" \
            --arg status "$dispatch_status" \
            --argjson packages "$entries" \
            --argjson ready_packages "$ready_entries" \
            --argjson needs_owner_release "$needs_owner_release" \
            '{surface_kind:$surface_kind,source_run_id:$source_run_id,
              source_run_attempt:$source_run_attempt,
              framework_source_commit:$framework_source_commit,
              release_set_generation:$release_set_generation,status:$status,
              packages:$packages,ready_packages:$ready_packages,
              needs_owner_release:$needs_owner_release}' > "$dispatch_plan"
          {
            echo "### Daily package channel"
            echo "- Status: \`$summary_status\`"
            echo "- Publish required: \`$publish_required\`"
            echo "- Independent owner-channel changes: \`$changed_packages_json\`"
            echo "- Dispatch status: \`$dispatch_status\`"
            echo "- Owner releases still needed: \`$needs_count\`"
            echo "- Package publication scope: \`packages_only\`"
            echo "- Non-Package diagnostics: \`$non_package_changed_components_json\`"
            echo "- Retained components: \`$(jq -c .retained_components "$summary")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload daily package-channel candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-daily-package-channel-candidate-${{ steps.generation.outputs.release_set_generation }}
          path: dist/opl-daily-packages
          if-no-files-found: error
